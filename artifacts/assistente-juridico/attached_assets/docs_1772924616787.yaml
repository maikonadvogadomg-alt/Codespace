      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        Informe abaixo o seu token de API.

        Esta documentação interativa automaticamente incluirá o header 'Authorization', com a string 'Bearer' antes do token.

        Ou seja: para testar a API nesta interface, você deve informar **APENAS** o seu token de API abaixo, sem a palavra 'Bearer' e nem a palavra Authorization, informando **apenas** o token.
      
