kind = "web"
previewPath = "/app"
title = "Assistente Jurídico"
router = "path"

[[services]]
name = "web"
paths = ["/app"]
localPort = 5000

[services.development]
run = "cd /home/runner/workspace/artifacts/assistente-juridico && PORT=5000 BASE_PATH=/app npm run dev"

[services.production]
build = "cd /home/runner/workspace/artifacts/assistente-juridico && BASE_PATH=/app npm run build"
run = "cd /home/runner/workspace/artifacts/assistente-juridico && PORT=5000 BASE_PATH=/app npm run start"

[services.env]
PORT = "5000"
BASE_PATH = "/app"
