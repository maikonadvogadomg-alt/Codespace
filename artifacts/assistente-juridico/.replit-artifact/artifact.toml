kind = "web"
previewPath = "/"
title = "Assistente Jurídico"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 5000

[services.development]
run = "cd /home/runner/workspace/artifacts/assistente-juridico && PORT=5000 npm run dev"

[services.production]
build = "cd /home/runner/workspace/artifacts/assistente-juridico && npm run build"
run = "cd /home/runner/workspace/artifacts/assistente-juridico && PORT=5000 npm run start"

[services.env]
PORT = "5000"
