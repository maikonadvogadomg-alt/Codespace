kind = "web"
previewPath = "/app"
title = "Assistente Jurídico"
router = "path"

[[services]]
name = "web"
paths = ["/app"]
localPort = 5000

[services.development]
run = "cd /home/runner/workspace/artifacts/assistente-juridico && PORT=5000 BASE_PATH=/app npm run dev"

[services.production]

[services.production.build]
args = ["npm", "run", "build", "--prefix", "artifacts/assistente-juridico"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/assistente-juridico/dist/index.cjs"]

[services.production.run.env]
PORT = "5000"
NODE_ENV = "production"
BASE_PATH = "/app"

[services.env]
PORT = "5000"
BASE_PATH = "/app"
